project:
  name: "ar0x"
  version: "1.0.0"
  mode: "defensive_audit"

llm:
  # Supported providers: "ollama" | "gemini" | "openai" | "anthropic" | "groq" | "openrouter"
  provider: "ollama"
  
  # Examples:
  # - Ollama     : "qwen2.5-coder:7b" or "llama3.1:8b"
  # - Gemini     : "gemini-2.5-flash" or "gemini-2.5-pro"
  # - OpenAI     : "gpt-4o" or "gpt-4o-mini"
  # - Anthropic  : "claude-3-5-sonnet-latest"
  # - Groq       : "llama-3.3-70b-versatile"
  model: "qwen2.5-coder:7b"
  
  # Used for Ollama or custom OpenAI-compatible endpoints
  base_url: "http://127.0.0.1:11434"
  
  # Leave empty to read automatically from ENV (AR0X_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY)
  api_key: ""
  
  temperature: 0.1
  timeout_seconds: 60

crawler:
  max_depth: 2
  rate_limit_requests_per_sec: 2
  respect_robots_txt: true

adva:
  enable_differential_check: true
  confidence_threshold: 0.75

reporting:
  format: "sarif-2.1.0"
  include_xai_trace: true
  output_dir: "./reports"
